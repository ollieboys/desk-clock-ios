name: build-ios-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild \
            -project ClockApp.xcodeproj \
            -scheme ClockApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/ClockApp.app Payload/
          zip -qry DeskClock-unsigned.ipa Payload
          ls -lh DeskClock-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeskClock-unsigned-ipa
          path: DeskClock-unsigned.ipa
          if-no-files-found: error
